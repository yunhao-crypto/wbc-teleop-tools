apply plugin: 'com.android.library'

android {
    namespace 'com.vita.xr.camera'
    compileSdkVersion 31
    defaultConfig { minSdkVersion 30; targetSdkVersion 31 }
    sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
