# @package _global_

defaults:
  - /training: train_base
  - /algo: ppo
  - /robot: unitree/H2/h2_31dof_training_isaaclab
  - /env: velocity_tracking
  - /env/terminations: termination_velocity_tracking
  - /env/observations: velocity_tracking/obs_velocity_tracking_headless_subset
  - /env/rewards: velocity_tracking/rew_velocity_tracking_h2
  - /env/domain_randomization: domain_rand_velocity_unitree_r1_h2
  - /env/terrain: isaaclab_rough
  - /modules: velocity_tracking/velocity_tracking_mlp
  - _self_

project_name: GMRFreeHoloMotionH2Velocity
experiment_name: gmr_free_h2_velocity_from_scratch_10000
checkpoint: null
base_seed: 20260817
train_hdf5_roots: []

env:
  config:
    seed: ${sum:[${base_seed},${process_id}]}
    actions:
      dof_pos:
        type: joint_position
        params:
          asset_name: robot
          joint_names: ${robot.velocity_policy_dof_names}
          preserve_order: true
          use_default_offset: true
          scale: ${robot.actuators.velocity_policy_action_scale}
robot:
  actions_dim: 29

algo:
  config:
    # Velocity has no ref_motion command seed; pin PPO initialization as well
    # as the environment so cluster restarts are reproducible.
    seed: ${sum:[${base_seed},${process_id}]}
    num_learning_iterations: 10000
    save_interval: 1000
    export_policy: true
    # HoloMotion-local A/B: the pinned physical/reward contract still collapsed
    # with sigma=1.0, while sigma=0.2 remained non-collapsed through 100 iters.
    # Reintroduce larger exploration only after the nominal standing gate.
    init_noise_std: 0.2
    symmetry_loss: {enabled: false}

terminations:
  # unitree_rl_mjlab uses a 70-degree fall threshold for R1/H2 velocity.
  bad_orientation:
    params: {limit_angle: 1.2217304763960306}

velocity_policy_contract:
  policy_action_dim: 29
  controller_target_dim: 31
  policy_joint_names: ${robot.velocity_policy_dof_names}
  controller_joint_names: ${robot.dof_names}
  omitted_head_joint_names: ${robot.head_dof_names}
  omitted_head_target_source: asset_default
