# @package _global_

defaults:
  - domain_rand_medium
  - _self_

# The official Kuavo S54 actuator already samples an internal 0--4 physics-step
# command delay.  Disable the independent environment-level delay so it is not
# applied twice.  Other ranges follow the public S54 locomotion configuration.
domain_rand:
  action_delay: {enabled: false, min_delay: 0, max_delay: 0}
  default_dof_pos_bias:
    mode: startup
    params:
      joint_names: [".*"]
      pos_distribution_params: [-0.1, 0.1]
      operation: add
      distribution: uniform
  rigid_body_com:
    mode: startup
    params:
      body_names: ${robot.root_name}
      com_range:
        x: [-0.05, 0.05]
        y: [-0.05, 0.05]
        z: [-0.05, 0.05]
  randomize_mass:
    mode: startup
    params:
      body_names: ["${robot.root_name}"]
      mass_range: [-5.0, 5.0]
  rigid_body_material:
    mode: startup
    params:
      body_names: ".*"
      static_friction_range: [0.3, 1.0]
      dynamic_friction_range: [0.3, 1.0]
      restitution_range: [0.0, 0.3]
      num_buckets: 64
  randomize_actuator_gains:
    mode: startup
    params:
      asset_name: robot
      body_names: ".*"
      stiffness_distribution_params: [0.8, 1.2]
      damping_distribution_params: [0.8, 1.2]
      operation: scale
      distribution: uniform
