# @package _global_

defaults:
  - domain_rand_medium_unitree_unknown_actuator
  - _self_

# R1/H2 velocity bootstrap contract aligned with unitree_rl_mjlab at
# 1425b15f73bd4095f0df53709d7c389c3eb9e790.  The source task has no generic
# action delay, mass randomization, or actuator-gain randomization.  Those
# unverified perturbations must be introduced only after a nominal policy has
# passed the velocity-training gates.
domain_rand:
  action_delay:
    enabled: false
    min_delay: 0
    max_delay: 0

  rigid_body_com:
    mode: startup
    params:
      body_names: ${robot.torso_name}
      com_range:
        x: [-0.05, 0.05]
        y: [-0.05, 0.05]
        z: [-0.05, 0.05]

  randomize_mass: null

  push_by_setting_velocity:
    mode: interval
    interval_range_s: [5.0, 6.0]
    params:
      velocity_range:
        x: [-0.5, 0.5]
        y: [-0.5, 0.5]
        z: [-0.4, 0.4]
        roll: [-0.52, 0.52]
        pitch: [-0.52, 0.52]
        yaw: [-0.78, 0.78]

  randomize_actuator_gains: null
