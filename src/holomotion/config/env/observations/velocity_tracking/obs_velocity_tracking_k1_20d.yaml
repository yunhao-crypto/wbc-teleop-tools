# @package _global_

# Official-compatible K1 locomotion contract: Actor and Critic observe only the
# 20 body joints controlled by the velocity policy.  The two head joints stay
# under default PD control and are not padded into the policy observation.
obs:
  context_length: 8
  n_fut_frames: 0
  target_fps: 50

  obs_groups:
    unified:
      atomic_obs_list:
        - actor_velocity_command:
            func: velocity_command
            history_length: ${obs.context_length}
            flatten_history_dim: false
            mirror_func: mirror_velocity_command
            mirror_config: {}
        - actor_projected_gravity:
            func: projected_gravity
            history_length: ${obs.context_length}
            flatten_history_dim: false
            noise:
              type: AdditiveUniformNoiseCfg
              params: {n_min: -0.1, n_max: 0.1}
            mirror_func: mirror_vec3
            mirror_config: {}
        - actor_rel_robot_root_ang_vel:
            func: rel_robot_root_ang_vel
            history_length: ${obs.context_length}
            flatten_history_dim: false
            noise:
              type: AdditiveUniformNoiseCfg
              params: {n_min: -0.2, n_max: 0.2}
            mirror_func: mirror_axial_vec3
            mirror_config: {}
        - actor_dof_pos:
            func: dof_pos
            params:
              joint_names: ${robot.velocity_policy_dof_names}
            history_length: ${obs.context_length}
            flatten_history_dim: false
            noise:
              type: AdditiveUniformNoiseCfg
              params: {n_min: -0.01, n_max: 0.01}
        - actor_dof_vel:
            func: dof_vel
            params:
              joint_names: ${robot.velocity_policy_dof_names}
            history_length: ${obs.context_length}
            flatten_history_dim: false
            noise:
              type: AdditiveUniformNoiseCfg
              params: {n_min: -0.5, n_max: 0.5}
        - actor_last_action:
            func: last_action
            history_length: ${obs.context_length}
            flatten_history_dim: false

        - critic_velocity_command:
            func: velocity_command
        - critic_rel_robot_root_lin_vel:
            func: rel_robot_root_lin_vel
        - critic_rel_robot_root_ang_vel:
            func: rel_robot_root_ang_vel
        - critic_root_rel_robot_bodylink_pos_flat:
            func: root_rel_robot_bodylink_pos_flat
            params:
              keybody_names: ${robot.key_bodies}
        - critic_root_rel_robot_bodylink_rot_mat_flat:
            func: root_rel_robot_bodylink_rot_mat_flat
            params:
              keybody_names: ${robot.key_bodies}
        - critic_dof_pos:
            func: dof_pos
            params:
              joint_names: ${robot.velocity_policy_dof_names}
        - critic_dof_vel:
            func: dof_vel
            params:
              joint_names: ${robot.velocity_policy_dof_names}
        - critic_last_action:
            func: last_action
      enable_corruption: true
      concatenate_terms: false
