# @package _global_

# X1 29-DoF full-body velocity reward. The serial chain terminates at
# ankle-roll links and has a 3-DoF lumbar chain but no head joint.
rewards:
  stand_still_action_rate:
    weight: -1.0
    params: {command_name: base_velocity}
  feet_contact_without_cmd:
    weight: 1.0
    params:
      command_name: base_velocity
      sensor_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: contact_forces
        body_names: [link_left_ankle_roll, link_right_ankle_roll]
  track_stand_still_exp:
    weight: 5.0
    params: {command_name: base_velocity, std: 0.2}
  track_lin_vel_xy_heading_aligned_frame_exp:
    weight: 3.0
    params: {std: 0.5, command_name: base_velocity}
  track_ang_vel_z_heading_aligned_frame_exp:
    weight: 3.0
    params: {std: 0.5, command_name: base_velocity}
  is_alive: {weight: 0.15, params: {}}
  lin_vel_z_l2: {weight: -1.0, params: {}}
  ang_vel_xy_l2: {weight: -5.0e-2, params: {}}
  joint_acc_l2: {weight: -1.0e-6, params: {}}
  action_rate_l2: {weight: -1.0e-1, params: {}}
  joint_pos_limits:
    weight: -5.0
    params:
      asset_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: robot
        joint_names: [".*"]
  feet_air_time_v4:
    weight: 1.0
    params:
      threshold: 0.5
      sensor_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: contact_forces
        body_names: [link_left_ankle_roll, link_right_ankle_roll]
      command_name: base_velocity
  fly:
    weight: -1.0
    params:
      threshold: 1.0
      sensor_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: contact_forces
        body_names: [link_left_ankle_roll, link_right_ankle_roll]
  feet_too_near:
    weight: -10.0
    threshold: 0.2
    params:
      asset_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: robot
        body_names: [link_left_ankle_roll, link_right_ankle_roll]
  joint_deviation_l1_arms:
    weight: -0.3
    params:
      asset_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: robot
        joint_names:
          - ".*_hip_roll_joint"
          - lumbar_roll_joint
          - lumbar_pitch_joint
          - ".*_shoulder_roll_joint"
          - ".*_shoulder_yaw_joint"
          - ".*_wrist_.*_joint"
  joint_deviation_l1_legs_yaw:
    weight: -0.15
    params:
      asset_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: robot
        joint_names:
          - lumbar_yaw_joint
          - ".*_hip_yaw_joint"
          - ".*_elbow_.*_joint"
          - ".*_ankle_.*_joint"
  joint_deviation_l1_legs:
    weight: -0.02
    params:
      asset_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: robot
        joint_names:
          - ".*_shoulder_pitch_joint"
          - ".*_hip_pitch_joint"
          - ".*_knee_pitch_joint"
  flat_orientation_l2: {weight: -5.0, params: {}}
  base_height_l2:
    weight: -10.0
    params: {target_height: 0.70}
  feet_slide:
    weight: -1.0
    params:
      asset_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: robot
        body_names: [link_left_ankle_roll, link_right_ankle_roll]
      sensor_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: contact_forces
        body_names: [link_left_ankle_roll, link_right_ankle_roll]
  undesired_contacts:
    weight: -1.0
    params:
      threshold: 1.0
      sensor_cfg:
        _target_: isaaclab.managers.scene_entity_cfg.SceneEntityCfg
        name: contact_forces
        body_names: ["${robot.undesired_contacts_regrex}"]
  torso_xy_ang_vel_l2_penalty:
    weight: -1.0
    params: {body_name: link_lumbar_pitch}
  torso_upright_l2_penalty:
    weight: -1.0
    params:
      body_name: link_lumbar_pitch
      # link_lumbar_pitch is rolled +90 degrees at the neutral pose.
      neutral_body_quat_wxyz: [0.7071067811865476, 0.7071067811865476, 0.0, 0.0]
