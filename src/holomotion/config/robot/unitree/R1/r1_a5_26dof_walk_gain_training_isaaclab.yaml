# @package _global_

defaults:
  - /robot/unitree/R1/r1_a5_26dof_training_isaaclab
  - _self_

# R1 original-Walk gains measured from the physical robot LowCmd stream.
# Action scales preserve the existing HoloMotion convention:
#   action_scale = 0.25 * static_effort_limit / stiffness.
robot:
  actuators:
    all_joints:
      stiffness:
        ".*_hip_.*_joint": 84.335
        ".*_knee_joint": 84.335
        ".*_ankle_.*_joint": 31.413
        "waist_.*_joint": 84.335
        ".*_shoulder_(pitch|roll)_joint": 84.335
        ".*_shoulder_yaw_joint": 15.706
        ".*_elbow_joint": 15.706
        ".*_wrist_roll_joint": 15.706
        "head_pitch_joint": 50.0
        "head_yaw_joint": 10.0
      damping:
        ".*_hip_.*_joint": 5.369
        ".*_knee_joint": 5.369
        ".*_ankle_.*_joint": 2.0
        "waist_.*_joint": 5.369
        ".*_shoulder_(pitch|roll)_joint": 5.369
        ".*_shoulder_yaw_joint": 1.0
        ".*_elbow_joint": 1.0
        ".*_wrist_roll_joint": 1.0
        "head_pitch_joint": 2.0
        "head_yaw_joint": 0.1
    action_scale:
      ".*_hip_.*_joint": 0.177862098
      ".*_knee_joint": 0.177862098
      ".*_ankle_.*_joint": 0.397924426
      "waist_.*_joint": 0.177862098
      ".*_shoulder_(pitch|roll)_joint": 0.177862098
      ".*_shoulder_yaw_joint": 0.525276964
      ".*_elbow_joint": 0.525276964
      ".*_wrist_roll_joint": 0.525276964
      "head_pitch_joint": 0.165
      "head_yaw_joint": 0.825
    velocity_policy_action_scale:
      ".*_hip_.*_joint": 0.177862098
      ".*_knee_joint": 0.177862098
      ".*_ankle_.*_joint": 0.397924426
      "waist_.*_joint": 0.177862098
      ".*_shoulder_(pitch|roll)_joint": 0.177862098
      ".*_shoulder_yaw_joint": 0.525276964
      ".*_elbow_joint": 0.525276964
      ".*_wrist_roll_joint": 0.525276964
